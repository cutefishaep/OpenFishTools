name: 🚀 Build & Release

# ─────────────────────────────────────────────────────────────────────────────
# Triggers when you push a version tag like:  git tag v1.0.8 && git push --tags
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as official GitHub Release?'
        type: boolean
        default: false

env:
  APP_NAME: OpenFishTools

# ─────────────────────────────────────────────────────────────────────────────
# Job 1 — Build Mac .pkg (runs on macOS runner, uses pkgbuild + productbuild)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build-mac:
    name: 🍎 Build Mac .pkg
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+ ]]; then
            VERSION="1.1.1"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION (tag: $GITHUB_REF_NAME)"

      - name: Inject version into manifest and installer files
        run: |
          chmod +x scripts/update_version.sh
          ./scripts/update_version.sh ${{ steps.version.outputs.VERSION }}

      - name: Build Mac .pkg installer
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd Installer/Mac
          chmod +x build_pkg.sh
          ./build_pkg.sh

      - name: Verify .pkg was created
        run: |
          PKG=$(ls Installer/Mac/*.pkg 2>/dev/null | head -n 1)
          if [ -z "$PKG" ]; then
            echo "❌ ERROR: No .pkg file found in Installer/Mac/"
            exit 1
          fi
          echo "✅ Found: $PKG"
          echo "PKG_PATH=$PKG" >> "$GITHUB_ENV"

      - name: Upload Mac installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: Installer/Mac/${{ env.APP_NAME }}.pkg
          if-no-files-found: error
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# Job 2 — Build Windows Setup.exe (runs on Windows runner, uses Inno Setup 6)
# ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: 🪟 Build Windows Setup.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+ ]]; then
            VERSION="1.1.1"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Inject version into manifest and installer files
        shell: bash
        run: |
          chmod +x scripts/update_version.sh
          ./scripts/update_version.sh ${{ steps.version.outputs.VERSION }}

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Build Windows Setup.exe
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\iscc.exe" /DMyAppVersion=${{ steps.version.outputs.VERSION }} "Installer\Windows\OpenFishTools_Setup.iss"

      - name: Verify .exe was created
        shell: bash
        run: |
          EXE=$(ls Installer/Windows/*.exe 2>/dev/null | head -n 1)
          if [ -z "$EXE" ]; then
            echo "❌ ERROR: No .exe file found in Installer/Windows/"
            exit 1
          fi
          echo "✅ Found: $EXE"

      - name: Upload unsigned installer for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-installer
          path: Installer/Windows/${{ env.APP_NAME }}_Setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign Windows Installer with SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: '16ae4ab4-7257-4337-b89e-43385d8e39aa'
          project-slug: 'OpenFishTools'
          signing-policy-slug: 'Release_Policy'
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: 'true'
          output-artifact-directory: 'Installer/Windows'

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Installer/Windows/${{ env.APP_NAME }}_Setup.exe
          if-no-files-found: error
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# Job 3 — Create GitHub Release (waits for both builds, attaches both files)
# ─────────────────────────────────────────────────────────────────────────────
  release:
    name: 📦 Publish GitHub Release
    needs: [build-mac, build-windows]
    if: startsWith(github.ref, 'refs/tags/') || inputs.create_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to create releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate release notes from changelog
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          python3 -c "
          import re, datetime
          version = '$VERSION'
          build_date = datetime.datetime.utcnow().strftime('%Y-%m-%d')
          fallback = f'**Version:** {version}\n**Built:** {build_date}'
          
          try:
              with open('changelog.md', 'r', encoding='utf-8') as f:
                  text = f.read()
              pattern = r'(##\s*\[?' + re.escape(version) + r'\]?[\s\S]*?)(?=\n##\s*\[|\Z)'
              match = re.search(pattern, text)
              notes = match.group(1).strip() if match else fallback
          except Exception:
              notes = fallback
          
          with open('release_notes.md', 'w', encoding='utf-8') as out:
              out.write(notes)
          "
          echo "Generated release_notes.md:"
          cat release_notes.md

      - name: Download Mac installer
        uses: actions/download-artifact@v4
        with:
          name: mac-installer
          path: dist/

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/

      - name: List release assets
        run: |
          echo "Assets to release:"
          ls -lh dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "v${{ steps.version.outputs.VERSION }}"
          body_path: release_notes.md
          files: dist/*
          draft: false
          prerelease: false
          make_latest: true
